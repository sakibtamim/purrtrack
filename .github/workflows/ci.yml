name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  build-and-typecheck:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Typecheck monorepo
        run: pnpm run typecheck

  test-suite:
    name: Test Suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: purrtrack_test
          POSTGRES_USER: purrtrack
          POSTGRES_PASSWORD: purrtrack_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Database Schema
        env:
          DATABASE_URL: postgres://purrtrack:purrtrack_password@localhost:5432/purrtrack_test
        run: pnpm db:push

      - name: Run Test Suite
        env:
          DATABASE_URL: postgres://purrtrack:purrtrack_password@localhost:5432/purrtrack_test
        run: pnpm test
