name: Deploy PurrTrack to VPS

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          API_PORT: ${{ secrets.API_PORT }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DATABASE_URL,DISCORD_BOT_TOKEN,DISCORD_CLIENT_ID,DISCORD_GUILD_ID,API_PORT,SSH_TARGET
          script: |
            set -e

            # Load environment profiles (NVM, PNPM, Node)
            [ -f ~/.bash_profile ] && . ~/.bash_profile
            [ -f ~/.bashrc ] && . ~/.bashrc
            [ -f ~/.profile ] && . ~/.profile
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            TARGET_DIR="${SSH_TARGET:-$HOME/htdocs/purrtrack.infra.purrfecthq.com}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Clone if not present, otherwise fetch & reset to latest deploy branch
            if [ ! -d ".git" ]; then
              echo "Cloning repository on deploy branch..."
              git clone -b deploy https://github.com/sakibtamim/purrtrack.git .
            else
              echo "Fetching latest changes on deploy branch..."
              git fetch origin deploy
              git reset --hard origin/deploy
            fi

            # Configure root .env
            echo "Configuring .env..."
            echo "NODE_ENV=production" > .env
            echo "API_PORT=${API_PORT:-5125}" >> .env
            echo "API_HOST=0.0.0.0" >> .env
            echo "DATABASE_URL=${DATABASE_URL}" >> .env
            echo "DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}" >> .env
            echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" >> .env
            echo "DISCORD_GUILD_ID=${DISCORD_GUILD_ID}" >> .env

            # Install dependencies
            echo "Installing dependencies..."
            HUSKY=0 pnpm install --frozen-lockfile

            # Run DB migrations & sync Discord slash commands
            echo "Running database migrations..."
            pnpm db:migrate

            echo "Deploying Discord slash commands..."
            pnpm deploy:commands

            # Build all monorepo packages
            echo "Building monorepo..."
            pnpm build

            # Ensure PM2 is installed and reload apps
            echo "Restarting PM2 processes..."
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2 --force
            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save

            echo "PurrTrack deployment finished successfully!"
